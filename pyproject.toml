[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gcp-fde-factories"
version = "0.5.0"
description = "Reusable, empirically validated Scion software factory packs for Google Cloud FDEs."
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0.2",
  "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[tool.setuptools]
packages = []
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
