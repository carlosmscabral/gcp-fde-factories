# Continuous integration workflow for gcp-fde-factories.
# Runs static pack checks, Release Kit generation, pytest unit suite, contract canaries,
# bash and Python syntax checks, and Terraform validation across BOTH packs/gecx and packs/adk.
name: Factory Catalog CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install catalog tooling
        run: python3 -m pip install -e ".[dev]"

      - name: Run static pack, lock, budget, TTL, and clean-room checks across all active packs
        run: |
          ./build.sh --check packs/gecx
          ./build.sh --check packs/adk
          ./build.sh --check packs/_template-pack

      - name: Build offline Release Kits for all active packs
        run: |
          ./build.sh --release-kit packs/gecx --out /tmp/gecx-kit-ci
          ./build.sh --release-kit packs/adk --out /tmp/adk-kit-ci
          ./build.sh --release-kit packs/_template-pack --out /tmp/template-kit-ci

      - name: Run unit tests
        run: ./build.sh --test

      - name: Verify contract canaries (GECX CLI + ADK GE Export)
        run: |
          python3 canaries/gecx/check_cli_contract.py
          python3 canaries/adk/check_ge_contract.py

      - name: Validate shell and Python syntax across all packs and bootstrap scripts
        run: |
          for f in build.sh scripts/hands-on-walkthrough.sh deploy/03-hub-bootstrap/*.sh packs/gecx/scripts/*.sh packs/adk/scripts/*.sh; do
            bash -n "$f"
          done
          python3 -m py_compile $(find core-gcp-fde scripts packs/gecx/scripts packs/adk/scripts deploy/03-hub-bootstrap canaries -name '*.py')

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Validate Terraform stages
        run: |
          for dir in deploy/01-landing-zone deploy/02-factory-runtime/lite-vm deploy/02-factory-runtime/ha-gke; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
