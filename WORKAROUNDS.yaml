# Tracked SDK and platform workarounds with mandatory 90-day TTL and removal tests.
# `./build.sh --check` fails CI if any entry exceeds max_age_days without review.
schema_version: "1"
max_age_days: 90

workarounds:
  - id: "WK-001"
    component: "cxas-scrapi==1.11.0"
    added_date: "2026-11-22"
    expires_date: "2027-02-20"
    summary: "Avoid combining --eval-type with --min-pass-rate or --runs in cxas run."
    reason: "cxas_scrapi/cli/main.py line 596 omits eval_type when min_pass_rate or runs is set, causing ValueError."
    mitigation: "packs/gecx/scripts/gecx_sandbox_gate.py calls cxas run --eval-type all --wait and enforces pass thresholds via CES REST evaluationRuns."
    removal_test: "Run 'cxas run --app-name <app> --eval-type all --wait --min-pass-rate 0.5' on next cxas-scrapi version and confirm it triggers without ValueError."

  - id: "WK-002"
    component: "cxas-scrapi==1.11.0"
    added_date: "2026-11-22"
    expires_date: "2027-02-20"
    summary: "Avoid cxas ci-test and --display-name-prefix empty-match fail-open behavior."
    reason: "cxas ci-test uses one SA, skips teardown, passes --filter-auto-metrics, and exits 0 when zero evaluations match."
    mitigation: "Split deployer push and evaluator run across separate SAs and fail closed when REST evaluationRuns totalCount equals 0."
    removal_test: "Verify upstream cxas ci-test supports split SAs, automatic teardown, and non-zero exit on zero evaluations."

  - id: "WK-003"
    component: "scion==v0.4.0-preview.3"
    added_date: "2026-11-22"
    expires_date: "2027-02-20"
    summary: "Run external Delta Watcher instead of alpha hub.github_triggers."
    reason: "GitHub webhook triggers are alpha and cannot traverse an IAP-protected Scion Hub."
    mitigation: "scripts/delta-watcher polls GitHub outside the LLM and wakes coordinator only on new events."
    removal_test: "Verify GA GitHub App polling or IAP-safe webhook relay in future Scion release."

  - id: "WK-004"
    component: "scion==v0.4.0-preview.3"
    added_date: "2026-11-24"
    expires_date: "2027-02-22"
    summary: "Set server.hub.gcp_iam_deny_unknown_policy to fail-open for project-scoped Hub SAs while keeping gcp_iam_check_mode=enforce."
    reason: "HC-01 proved Policy Troubleshooter v3 returns UNKNOWN_INFO (allow=GRANTED, deny=UNKNOWN_INFO) whenever a project-scoped Hub SA lacks org-wide roles/iam.denyReviewer, blocking all agent spawns under fail-closed."
    mitigation: "deploy/03-hub-bootstrap/bootstrap-hub-project.sh and lite-vm cloud-init enforce gcp_iam_check_mode=enforce with gcp_iam_deny_unknown_policy=fail-open (overridable via GCP_IAM_DENY_UNKNOWN_POLICY=fail-closed when org-level denyReviewer is granted)."
    removal_test: "Grant org-level roles/iam.denyReviewer to Hub SA or verify upstream Scion supports project-scoped IAM deny checks without UNKNOWN_INFO."

  - id: "WK-005"
    component: "scion==v0.4.0-preview.3"
    added_date: "2026-11-24"
    expires_date: "2027-02-22"
    summary: "First-time OIDC admin user requires Hub restart or member-to-admin transition to materialize super-admin RoleBinding."
    reason: "HC-01 (F10) proved first-time federated OIDC user creation sets users.role='admin' without inserting the super-admin RoleBinding, and subsequent applyLiveSignInPolicy skips ensureSuperAdminBinding when oldRole == newRole."
    mitigation: "Restart the persistent Hub once after the initial OIDC sign-in so startup backfillSuperAdminBinding creates the binding, or transition role via bootstrap runbook."
    removal_test: "Sign in as a new federated OIDC admin on next Scion release and verify PUT /api/v1/admin/server-config succeeds on first request without restart."
