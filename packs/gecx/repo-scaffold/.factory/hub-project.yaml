# Declarative Hub project overlay reconciled by deploy/03-hub-bootstrap/bootstrap-hub-project.sh.
# Validated against schemas/hub-project.schema.json.
# Opinionated Vertex AI default using Scion generic semantic tiers (`small`, `medium`, `large`, `extra-large`)
# plus canonical `thinking_level` (0-100) so concrete models evolve automatically with upstream Scion.
# Defaults to `cross-model` with `claude_model_garden_enabled: false` (fail-closed) so Day-1 deploy works
# immediately on Vertex AI Gemini without manual Anthropic Model Garden activation.
# To enable cross-vendor Claude Opus reviews after activating Anthropic Claude in Vertex AI Model Garden:
#   1. Set diversity_profile: "cross-vendor"
#   2. Set harnesses.claude_model_garden_enabled: true
#   3. Set code-reviewer and security-auditor harness: "claude-vertex", model: "large", thinking_level: 75
schema_version: "1"
pack: "gecx"
pack_version: "0.5.0"
mode: "sandbox-direct"
diversity_profile: "cross-model"

limits:
  default_max_duration: "2h"
  default_max_turns: 60
  default_max_model_calls: 150
  auto_suspend_idle: true

harnesses:
  default: "antigravity-vertex"
  claude_model_garden_enabled: false
  vertex_gemini_location: "global"
  vertex_claude_region: "global"

model_routing:
  default:
    harness: "antigravity-vertex"
    model: "extra-large"
    thinking_level: 100
  developer:
    harness: "antigravity-vertex"
    model: "extra-large"
    thinking_level: 100
  architect:
    harness: "antigravity-vertex"
    model: "extra-large"
    thinking_level: 100
  code-reviewer:
    harness: "antigravity-vertex"
    model: "large"
    thinking_level: 100
  security-auditor:
    harness: "antigravity-vertex"
    model: "large"
    thinking_level: 100
  kaizen-analyst:
    harness: "antigravity-vertex"
    model: "extra-large"
    thinking_level: 75
  doc-writer:
    harness: "antigravity-vertex"
    model: "medium"
    thinking_level: 50

kaizen:
  enabled: true
  schedule_cron: "0 0 * * *"
  time_zone: "America/Sao_Paulo"
  coordinator_agent: "coordinator"
  enable_gcp_obs: false

exclude_skills: []
overlay_skills: []
