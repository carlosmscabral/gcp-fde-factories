# Pilot 1 Factory Pack manifest for Google Cloud CX Agent Studio (GECX / CES).
# Incorporates Preston's full 13-role agent-team hierarchy (Small Depth-1 and Chunky/Large Depth-3),
# the 2 split-SA GECX Sandbox specialists, and the closed-loop Kaizen Analyst (16 templates, 11 Hub Skill Bank skills).
schema_version: "1"

pack:
  name: "gecx"
  prefix: "gecx"
  version: "0.4.0"
  status: "pilot"
  description: "Google Cloud Customer Engagement Suite (GECX / CES) autonomous software factory pack with full 13-role SEP hierarchy, split-SA Sandbox verification, and closed-loop Kaizen."

upstream:
  agent_team_repo: "scion-frontiers/agent-team"
  agent_team_commit: "08faf48269da7d8dd0a20c4e5ca5093afb37495d"
  skills_lock: "skills.lock"

specialist_templates:
  # --- Orchestration tier (--role full: can create and supervise child agents) ---
  - name: "coordinator"
    base_role: "coordinator"
    delta_dir: "templates/coordinator"
    hub_role: "full"
    sandbox_sa_slot: "worker"
    role_skills:
      - "software-engineering-process"
      - "agent-state-continuity"
      - "artifact-durability"
    strip_hardcoded_model: true

  - name: "eng-manager"
    base_role: "eng-manager"
    delta_dir: "templates/eng-manager"
    hub_role: "full"
    sandbox_sa_slot: "worker"
    role_skills:
      - "software-engineering-process"
      - "agent-state-continuity"
      - "artifact-durability"
    strip_hardcoded_model: true

  # --- Discovery, architecture, implementation, review, and security (--role baseline) ---
  - name: "architect"
    base_role: "architect"
    delta_dir: "templates/architect"
    hub_role: "baseline"
    sandbox_sa_slot: "worker"
    role_skills:
      - "artifact-durability"
    strip_hardcoded_model: true

  - name: "investigator"
    base_role: "investigator"
    delta_dir: "templates/investigator"
    hub_role: "baseline"
    sandbox_sa_slot: "worker"
    role_skills:
      - "artifact-durability"
      - "software-engineering-process"
    strip_hardcoded_model: true

  - name: "developer"
    base_role: "developer"
    delta_dir: "templates/developer"
    hub_role: "baseline"
    sandbox_sa_slot: "worker"
    role_skills:
      - "artifact-durability"
    strip_hardcoded_model: true

  - name: "code-reviewer"
    base_role: "code-reviewer"
    delta_dir: "templates/code-reviewer"
    hub_role: "baseline"
    sandbox_sa_slot: "worker"
    role_skills:
      - "code-review"
      - "software-engineering-process"
    strip_hardcoded_model: true

  - name: "test-engineer"
    base_role: "test-engineer"
    delta_dir: "templates/test-engineer"
    hub_role: "baseline"
    sandbox_sa_slot: "worker"
    role_skills:
      - "artifact-durability"
    strip_hardcoded_model: true

  - name: "security-auditor"
    base_role: "security-auditor"
    delta_dir: "templates/security-auditor"
    hub_role: "baseline"
    sandbox_sa_slot: "worker"
    role_skills:
      - "artifact-durability"
    strip_hardcoded_model: true

  # --- GECX split-SA Sandbox verification lane (--role baseline) ---
  - name: "gecx-deployer"
    base_role: "developer"
    delta_dir: "templates/gecx-deployer"
    hub_role: "baseline"
    sandbox_sa_slot: "deployer"
    role_skills:
      - "artifact-durability"
    strip_hardcoded_model: true

  - name: "gecx-eval-tester"
    base_role: "qa-tester"
    delta_dir: "templates/gecx-eval-tester"
    hub_role: "baseline"
    sandbox_sa_slot: "evaluator"
    role_skills:
      - "artifact-durability"
    strip_hardcoded_model: true

  # --- Closed-loop Kaizen diagnostics (--role baseline, Option A via coordinator) ---
  - name: "kaizen-analyst"
    base_role: "investigator"
    delta_dir: "templates/kaizen-analyst"
    hub_role: "baseline"
    sandbox_sa_slot: "worker"
    role_skills:
      - "gcp-kaizen-analyst"
      - "artifact-durability"
    strip_hardcoded_model: true

  # --- Supporting roles inherited cleanly from pinned agent-team@08faf48 ---
  - name: "qa-tester"
    base_role: "qa-tester"
    hub_role: "baseline"
    sandbox_sa_slot: "worker"
    role_skills:
      - "artifact-durability"
    strip_hardcoded_model: true

  - name: "researcher"
    base_role: "researcher"
    hub_role: "baseline"
    sandbox_sa_slot: "worker"
    role_skills:
      - "artifact-durability"
    strip_hardcoded_model: true

  - name: "doc-writer"
    base_role: "doc-writer"
    hub_role: "baseline"
    sandbox_sa_slot: "worker"
    role_skills:
      - "artifact-durability"
    strip_hardcoded_model: true

  - name: "release-notes"
    base_role: "release-notes"
    hub_role: "baseline"
    sandbox_sa_slot: "worker"
    role_skills:
      - "artifact-durability"
      - "release-notes-daily"
    strip_hardcoded_model: true

  - name: "web-builder"
    base_role: "web-builder"
    hub_role: "baseline"
    sandbox_sa_slot: "worker"
    role_skills:
      - "artifact-durability"
    strip_hardcoded_model: true

project_skills:
  # Attached project-wide to every agent (guardrails + GECX foundry contract)
  - name: "gcp-fde-guardrails"
    local_dir: "core-gcp-fde/skills/gcp-fde-guardrails"
    version: "0.4.0"
    scope: "global"
    attach_to_project: true
  - name: "gcp-sandbox-contract"
    local_dir: "core-gcp-fde/skills/gcp-sandbox-contract"
    version: "0.4.0"
    scope: "global"
    attach_to_project: true
  - name: "gcp-kaizen-light"
    local_dir: "core-gcp-fde/skills/gcp-kaizen-light"
    version: "0.4.0"
    scope: "global"
    attach_to_project: true
  - name: "gcp-kaizen-analyst"
    local_dir: "core-gcp-fde/skills/gcp-kaizen-analyst"
    version: "0.4.0"
    scope: "global"
    attach_to_project: false
  - name: "gecx-foundry-adapter"
    local_dir: "packs/gecx/skills/gecx-foundry-adapter"
    version: "0.4.0"
    scope: "global"
    attach_to_project: true
  - name: "gecx-domain-guardrails"
    local_dir: "packs/gecx/skills/gecx-domain-guardrails"
    version: "0.4.0"
    scope: "global"
    attach_to_project: true

  # Published to Hub Skill Bank (offline) and mounted selectively via role_skills
  - name: "software-engineering-process"
    local_dir: "vendor/agent-team/skills/software-engineering-process"
    version: "1.0.0"
    scope: "global"
    attach_to_project: false
  - name: "agent-state-continuity"
    local_dir: "vendor/agent-team/skills/agent-state-continuity"
    version: "1.0.0"
    scope: "global"
    attach_to_project: false
  - name: "artifact-durability"
    local_dir: "vendor/agent-team/skills/artifact-durability"
    version: "1.0.0"
    scope: "global"
    attach_to_project: false
  - name: "code-review"
    local_dir: "vendor/agent-team/skills/code-review"
    version: "1.0.0"
    scope: "global"
    attach_to_project: false
  - name: "release-notes-daily"
    local_dir: "vendor/agent-team/skills/release-notes-daily"
    version: "1.0.0"
    scope: "global"
    attach_to_project: false

vendored_image_assets:
  - name: "cxas-agent-foundry"
    target_path: "/opt/gecx-foundry"
    upstream_repo: "GoogleCloudPlatform/cxas-scrapi"
    commit: "f55e877638dfc07879aad4082abc35c34f18359c"
    license: "Apache-2.0"

runtime_image:
  dockerfile: "packs/gecx/Dockerfile"
  harness_configs:
    - "core-gcp-fde/harness-configs/claude-vertex.yaml"
    - "core-gcp-fde/harness-configs/antigravity-vertex.yaml"

context_budget:
  max_total_lines_per_role: 1800
  max_lines_per_pack_skill: 300
  max_delta_rules: 15

verification:
  level1_offline_commands:
    - "cxas --no-input lint --app-dir cxas_app/<App>"
    - "python /opt/gecx-foundry/scripts/sync-callbacks.py --from-local cxas_app/<App>"
    - "cxas --no-input test-callbacks --app-dir evals/callback_tests"
    - "pytest tests/ -q"
  level2_sandbox_runner: "packs/gecx/scripts/gecx-eval-runner.sh"
  not_verifiable_in_sandbox:
    - "sip-trunk-routing"
    - "sbc-media-negotiation"
    - "audiocodes-vaic-connector"
    - "carrier-8khz-audio-codecs"
    - "dtmf-telephony-signaling"
    - "ccaas-live-agent-transfer"
