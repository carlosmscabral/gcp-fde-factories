  - name: google-agents-cli-observability
    local_dir: vendor/agents-cli/skills/google-agents-cli-observability
    version: "1.15.0"
    scope: global
    attach_to_project: false

vendored_image_assets:
  - name: "google-agents-cli"
    target_path: "/opt/adk-factory"
    upstream_repo: "google/agents-cli"
    commit: "2fa159a803aceec3b4df808901e53a08a6f1fb2a"
    license: "Apache-2.0"

runtime_image:
  dockerfile: "packs/adk/Dockerfile"
  harness_configs:
    - "core-gcp-fde/harness-configs/claude-vertex.yaml"
    - "core-gcp-fde/harness-configs/antigravity-vertex.yaml"

verification:
  level1_offline_commands:
    - "pytest tests/ -q"
    - "python3 /opt/adk-factory/ge_export.py validate --manifest ge_manifest.json"
  level2_sandbox_runner: "packs/adk/scripts/adk-eval-runner.sh"
  not_verifiable_in_sandbox:
    - "customer-private-vpc-peering"
    - "production-ge-app-oauth-consent"
    - "customer-idp-sso-federation"
