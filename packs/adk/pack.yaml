    scope: global
    attach_to_project: true
  - name: adk-ge-export-contract
    local_dir: packs/adk/skills/adk-ge-export-contract
    version: "0.1.0"
    scope: global
    attach_to_project: true

  # --- Role-scoped Kaizen, SEP, and vendored google/agents-cli v1.15.0 skills ---
  - name: gcp-kaizen-analyst
    local_dir: core-gcp-fde/skills/gcp-kaizen-analyst
    version: "0.4.0"
    scope: global
    attach_to_project: false
  - name: software-engineering-process
    local_dir: vendor/agent-team/skills/software-engineering-process
    version: "1.0.0"
    scope: global
    attach_to_project: false
  - name: agent-state-continuity
    local_dir: vendor/agent-team/skills/agent-state-continuity
    version: "1.0.0"
    scope: global
    attach_to_project: false
  - name: artifact-durability
    local_dir: vendor/agent-team/skills/artifact-durability
    version: "1.0.0"
    scope: global
    attach_to_project: false
  - name: code-review
    local_dir: vendor/agent-team/skills/code-review
    version: "1.0.0"
    scope: global
    attach_to_project: false
  - name: release-notes-daily
    local_dir: vendor/agent-team/skills/release-notes-daily
    version: "1.0.0"
    scope: global
    attach_to_project: false
  - name: google-agents-cli-workflow
    local_dir: vendor/agents-cli/skills/google-agents-cli-workflow
    version: "1.15.0"
    scope: global
    attach_to_project: false
  - name: google-agents-cli-adk-code
    local_dir: vendor/agents-cli/skills/google-agents-cli-adk-code
