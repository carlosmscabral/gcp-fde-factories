# Executable Pack Contract (Contract 1) for packs/adk (v0.1.0).
# Composes Preston's 13-role hierarchy + 3 specialists (16 offline adk-* templates)
# and 18 Hub Skill Bank skills (5 project-attached + 6 SEP/Kaizen + 7 vendored google/agents-cli v1.15.0).
schema_version: "1"

pack:
  name: adk
  prefix: adk
  version: "0.1.0"
  status: pilot
  description: "Google ADK (2.15+) Dockerfile-first factory pack with upstream google/agents-cli skills and dual Gemini Enterprise (GE App) export."

upstream:
  agent_team_repo: "scion-frontiers/agent-team"
  agent_team_commit: "08faf48269da7d8dd0a20c4e5ca5093afb37495d"
  skills_lock: "skills.lock"

context_budget:
  max_total_lines_per_role: 1800
  max_lines_per_pack_skill: 300
  max_delta_rules: 15

specialist_templates:
  - name: coordinator
    base_role: coordinator
    hub_role: full
    sandbox_sa_slot: worker
    delta_dir: templates/coordinator
    strip_hardcoded_model: true
    role_skills:
      - software-engineering-process
      - agent-state-continuity
      - artifact-durability
      - google-agents-cli-workflow

  - name: eng-manager
    base_role: eng-manager
    hub_role: full
    sandbox_sa_slot: worker
    delta_dir: templates/eng-manager
    strip_hardcoded_model: true
    role_skills:
      - software-engineering-process
      - agent-state-continuity
      - artifact-durability
      - google-agents-cli-workflow

  - name: architect
    base_role: architect
    hub_role: baseline
    sandbox_sa_slot: worker
    delta_dir: templates/architect
    strip_hardcoded_model: true
    role_skills:
      - artifact-durability
      - google-agents-cli-adk-code
      - google-agents-cli-scaffold

  - name: investigator
    base_role: investigator
    hub_role: baseline
    sandbox_sa_slot: worker
    delta_dir: templates/investigator
    strip_hardcoded_model: true
    role_skills:
      - software-engineering-process
      - artifact-durability
      - google-agents-cli-observability

  - name: developer
    base_role: developer
    hub_role: baseline
    sandbox_sa_slot: worker
    delta_dir: templates/developer
    strip_hardcoded_model: true
    role_skills:
      - artifact-durability
      - google-agents-cli-adk-code
      - google-agents-cli-scaffold

  - name: code-reviewer
    base_role: code-reviewer
    hub_role: baseline
    sandbox_sa_slot: worker
    delta_dir: templates/code-reviewer
    strip_hardcoded_model: true
    role_skills:
      - software-engineering-process
      - code-review
      - google-agents-cli-adk-code

  - name: test-engineer
    base_role: test-engineer
    hub_role: baseline
    sandbox_sa_slot: worker
    delta_dir: templates/test-engineer
    strip_hardcoded_model: true
    role_skills:
      - artifact-durability
      - google-agents-cli-eval

  - name: security-auditor
    base_role: security-auditor
    hub_role: baseline
    sandbox_sa_slot: worker
    delta_dir: templates/security-auditor
    strip_hardcoded_model: true
    role_skills:
      - artifact-durability

  - name: adk-deployer
    base_role: developer
    hub_role: baseline
    sandbox_sa_slot: deployer
    delta_dir: templates/adk-deployer
    strip_hardcoded_model: true
    role_skills:
      - artifact-durability
      - google-agents-cli-deploy
      - google-agents-cli-publish

  - name: adk-eval-tester
    base_role: qa-tester
    hub_role: baseline
    sandbox_sa_slot: evaluator
    delta_dir: templates/adk-eval-tester
    strip_hardcoded_model: true
    role_skills:
      - artifact-durability
      - google-agents-cli-eval
      - google-agents-cli-observability

  - name: kaizen-analyst
    base_role: investigator
    hub_role: baseline
    sandbox_sa_slot: worker
    delta_dir: templates/kaizen-analyst
    strip_hardcoded_model: true
    role_skills:
      - artifact-durability
      - gcp-kaizen-analyst
      - google-agents-cli-observability

  - name: qa-tester
    base_role: qa-tester
    hub_role: baseline
    sandbox_sa_slot: worker
    strip_hardcoded_model: true
    role_skills:
      - artifact-durability

  - name: researcher
    base_role: researcher
    hub_role: baseline
    sandbox_sa_slot: worker
    strip_hardcoded_model: true
    role_skills:
      - artifact-durability

  - name: doc-writer
    base_role: doc-writer
    hub_role: baseline
    sandbox_sa_slot: worker
    strip_hardcoded_model: true
    role_skills:
      - artifact-durability

  - name: release-notes
    base_role: release-notes
    hub_role: baseline
    sandbox_sa_slot: worker
    strip_hardcoded_model: true
    role_skills:
      - release-notes-daily
      - artifact-durability

  - name: web-builder
    base_role: web-builder
    hub_role: baseline
    sandbox_sa_slot: worker
    strip_hardcoded_model: true
    role_skills:
      - artifact-durability

