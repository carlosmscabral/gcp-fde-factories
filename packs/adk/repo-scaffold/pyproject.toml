[project]
name = "starter-adk-agent"
version = "0.1.0"
description = "Modular Google Cloud ADK starter agent following the native google-agents-cli (adk_python) layout."
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "google-adk[gcp,otel-gcp,bigquery-analytics]>=2.12.0,<3.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2026.10.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "fastapi<0.142.0",
    "uvicorn>=0.34.0,<1.0.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-agentplatform[agent-engines]>=2.2.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=2.2.0,<3.0.0",
    "protobuf>=6.31.1,<7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.12.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=2.2.0,<3.0.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app"]
