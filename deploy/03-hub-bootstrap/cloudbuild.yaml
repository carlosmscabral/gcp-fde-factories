# Optional internal Cloud Build pipeline for strict SecOps or Binary Authorization customers.
# Rebuilds core-gcp-fde-base and the target pack layer (gecx or adk) inside the customer Hub project.
options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _AR_URL: "us-central1-docker.pkg.dev/REPLACE_HUB_PROJECT/gecx-factory-images"
  _PACK: "gecx"
  _PACK_VERSION: "0.4.0"

steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "build-core-base"
    args:
      - "build"
      - "-f"
      - "core-gcp-fde/images/base.Dockerfile"
      - "-t"
      - "${_AR_URL}/core-gcp-fde-base:${_PACK_VERSION}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "build-pack-layer"
    args:
      - "build"
      - "-f"
      - "packs/${_PACK}/Dockerfile"
      - "--build-arg"
      - "CORE_BASE_IMAGE=${_AR_URL}/core-gcp-fde-base:${_PACK_VERSION}"
      - "-t"
      - "${_AR_URL}/scion-${_PACK}-runtime:${_PACK_VERSION}"
      - "."

images:
  - "${_AR_URL}/core-gcp-fde-base:${_PACK_VERSION}"
  - "${_AR_URL}/scion-${_PACK}-runtime:${_PACK_VERSION}"
