# Streamlined 2-block /grill-me interview bank (Wave 2: 1 Hub -> N Factories).
# Retires Express vs Complete track duality. Block 1 covers Product Owner intent (4 Qs)
# and Block 2 confirms Engineering reality pre-filled by the LLM reading CI workflows + Tier-A scan (4 Qs).
schema_version: "2"

questions:
  # --- Block 1: Product Owner (Business Intent, Scope, Team Preset, Intake) ---
  - id: mission_and_scope
    block: po
    pillar: "Block 1 (Product Owner): Mission, Scope, and Monorepo"
    field_path: mission
    applies_to_packs: ["all"]
    prompt: "State the factory mission in one sentence, list at least one explicit non-goal, confirm the Factory Pack (generic, adk, or gecx), and (if monorepo) confirm monorepo.subdir + monorepo.agent_prefix."
    why_we_ask: "Anchors scope and isolates sibling factories under .factory/<prefix>/factory.yaml when multiple factories share one monorepo."
    challenge_prompt: "Replace broad verbs like modernize with a concrete outcome, explicit non-goal, and exact monorepo subdir/prefix if scoped."

  - id: roster_preset
    block: po
    pillar: "Block 1 (Product Owner): Team Size and Tradeoff"
    field_path: roster
    applies_to_packs: ["all"]
    prompt: "Choose the agent roster preset: lean (DEFAULT — 5 roles: coordinator, developer, code-reviewer, security-auditor, test-engineer; fastest setup, lowest token burn, ~4.4x error cap) or full (complete scion-frontiers/agent-team SEP roster — adds eng-manager, architect, investigator, doc-writer, kaizen-analyst, qa-tester, web-builder, researcher, release-notes; takes longer to tune and burns more tokens). You can upgrade lean -> full on Day 2 anytime."
    why_we_ask: "Matches team overhead to repository complexity while making the setup-time and token-cost tradeoff explicit to the Product Owner."
    challenge_prompt: "Default to lean unless the repository runs complex multi-stream workstreams or the customer explicitly requests the full agent-team hierarchy."

  - id: invariants_and_wave1
    block: po
    pillar: "Block 1 (Product Owner): Invariants, Wave-1, and Optional Wave-0"
    field_path: invariants
    applies_to_packs: ["all"]
    prompt: "List hard invariants no PR may break, define 1-3 initial Wave-1 vertical-slice tasks (optional REQ-NNN), and confirm whether open modernization gaps should be folded into wave_0."
    why_we_ask: "Captures non-discoverable guardrails concisely in AGENTS.md (<6 KB) and seeds the Coordinator queue without creating empty placeholder files."
    challenge_prompt: "Rewrite subjective rules like be secure into verifiable checks enforceable by tests or code review."

  - id: autonomy_and_intake
    block: po
    pillar: "Block 1 (Product Owner): Autonomy, WIP, and GitHub Intake"
    field_path: intake
    applies_to_packs: ["all"]
    prompt: "Confirm autonomy (supervised or standard), max_wip (set reviewer_replicas: 2 when max_wip >= 4), and whether to enable the opt-in GitHub External Delta Watcher (factory:ready, max_concurrent_issues 1-3). Non-GitHub hosts run in best_effort manual trigger mode."
    why_we_ask: "Controls PR concurrency, human approval boundaries, and zero-token issue polling on IAP-protected Hubs."
    challenge_prompt: "Keep max_concurrent_issues between 1 and 3 and record the human confirmer name in confirmed_by."

  # --- Block 2: Engineering Lead (LLM Pre-Filled from CI Workflows + Tier-A Scan) ---
  - id: commands_and_pyramid
    block: engineering
    pillar: "Block 2 (Engineering): CI Commands and Evaluation Pyramid"
    field_path: commands
    applies_to_packs: ["all"]
    prompt: "Confirm canonical build, lint, test, and e2e commands (pre-filled by reading CI workflows and task wrappers), plus explicit not_verifiable_in_sandbox blind spots."
    why_we_ask: "Reading CI workflows outperforms manifest guessing; exact commands drive Level 1 offline checks and Level 2 sandbox gates."
    challenge_prompt: "Replace any placeholder lint command with a real command that exits non-zero on failure, and list private VPN/ERP blind spots."

  - id: toolchain_and_dockerfile
    block: engineering
    pillar: "Block 2 (Engineering): Runtime Toolchain and Dockerfile.customer"
    field_path: toolchain
    applies_to_packs: ["all"]
    prompt: "Confirm missing runtimes, version pins, private registries, or docker-compose/Testcontainers services, and approve the LLM-authored .factory/Dockerfile.customer plus toolchain.verify_binaries list (or confirm ci-only / manual escape hatch for Tier-C edge cases like Bazel/CUDA/Xcode)."
    why_we_ask: "Stage 03 lints, builds, verifies every binary as non-root scion, and pins the @sha256 digest before any agent spawns."
    challenge_prompt: "Ensure every binary in verify_binaries runs non-root after USER scion and no secrets or curl|sh pipes enter the Dockerfile."

  - id: cloud_and_models
    block: engineering
    pillar: "Block 2 (Engineering): Cloud Boundary and Vertex Diversity"
    field_path: mode
    applies_to_packs: ["all"]
    prompt: "Confirm execution mode (sandbox-direct or ci-only), deploy_target (cloud-run, gke, agent-engine, ces, custom, or none), and diversity_profile (cross-model 1P Gemini default, or cross-vendor only if Anthropic Claude is enabled in Vertex Model Garden)."
    why_we_ask: "Controls Stage 03 Sandbox SA registration, Level 2 deploy verification, and fail-closed Vertex Model Garden routing."
    challenge_prompt: "Never set cross-vendor unless Claude Model Garden is already enabled on inference_project_id; set deploy_target: none for libraries/CLIs."

  - id: conventions_and_hazards
    block: engineering
    pillar: "Block 2 (Engineering): Existing AI Files, Collisions, and Hazards"
    field_path: absorbed_conventions
    applies_to_packs: ["all"]
    prompt: "Confirm absorbed_conventions synthesized from existing AI files (AGENTS.md, CLAUDE.md, .cursor/rules/, Copilot instructions), resolve any flagged skill_collisions, and explicitly acknowledge blocking workspace hazards (path@sha256)."
    why_we_ask: "Preserves non-discoverable team conventions without bloating AGENTS.md (>6 KB) and neutralizes untrusted hooks/MCP before emit."
    challenge_prompt: "Confirm exact path@sha256 digests for every blocking workspace hazard and resolve any pack skill name collision."
