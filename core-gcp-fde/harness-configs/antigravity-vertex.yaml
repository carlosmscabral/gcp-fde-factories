# Harness configuration for Gemini models served via Vertex AI using Antigravity harness.
# Replace image digest and inference project during Stage 03 release staging.
schema_version: "1"
name: antigravity-vertex
harness: antigravity
image: "us-central1-docker.pkg.dev/cabral-gecx-spk-hub/gecx-spk-images/scion-gecx-runtime@sha256:730282ce9892339455780aaefb68c7d53cc9daa7bb2e9ea0d146e1626510ec1b"
model: "gemini-3.1-pro-preview"
env:
  GOOGLE_GENAI_USE_VERTEXAI: "true"
  GOOGLE_CLOUD_LOCATION: "global"
  GOOGLE_CLOUD_PROJECT: "REPLACE_INFERENCE_PROJECT"
resources:
  cpu: "2"
  memory: "4Gi"
